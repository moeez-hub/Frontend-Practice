  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,5,16,0.35) 0%, rgba(10,5,16,0.25) 45%, rgba(10,5,16,0.75) 100%);
    z-index: 1;
  }

  .stage {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
  }

  #clickBtn {
    padding: 18px 44px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #2a0845;
    background: linear-gradient(135deg, var(--gold), #ffb347);
    border: none;
    border-radius: 50px;
    box-shadow: 0 0 25px rgba(255, 215, 107, 0.7), 0 8px 20px rgba(0,0,0,0.5);
    cursor: pointer;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  #greeting {
    display: none;
    font-size: 13vw;
    line-height: 1.25;
    font-weight: 900;
    background: linear-gradient(90deg, var(--gold), var(--pink), var(--purple), var(--gold));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 3s linear infinite, popIn 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
    text-shadow: 0 0 40px rgba(255,255,255,0.15);
  }

  @media (min-width: 500px) {
    #greeting { font-size: 54px; }
  }

  @keyframes shine {
    to { background-position: 300% 0; }
  }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.3) rotate(-8deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .balloon {
    position: fixed;
    bottom: -160px;
    width: 60px;
    height: 76px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    z-index: 4;
    opacity: 0.95;
    animation-name: rise;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }

  .balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -22px;
    width: 2px;
    height: 22px;
    background: rgba(255,255,255,0.5);
    transform: translateX(-50%);
  }

  .balloon::before {
    content: "";
    position: absolute;
    top: 10px;
    left: 14px;
    width: 14px;
    height: 20px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: rotate(-20deg);
  }

  @keyframes rise {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.95; }
    50% { transform: translateY(-60vh) translateX(20px) rotate(8deg); }
    100% { transform: translateY(-125vh) translateX(-15px) rotate(-6deg); opacity: 0; }
  }

  .heart {
    position: fixed;
    bottom: -60px;
    z-index: 4;
    animation-name: floatHeart;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }

  .heart::before,
  .heart::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 24px;
    border-radius: 15px 15px 0 0;
    background: var(--pink);
  }

  .heart::before { left: 15px; transform: rotate(-45deg); transform-origin: 0 100%; }
  .heart::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

  @keyframes floatHeart {
    0% { transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity: 0.9; }
    50% { transform: translateY(-55vh) translateX(-18px) rotate(-10deg) scale(1); }
    100% { transform: translateY(-115vh) translateX(12px) rotate(8deg) scale(0.9); opacity: 0; }
  }

  .deco {
    font-size: 34px;
    margin-top: 14px;
    letter-spacing: 8px;
    animation: popIn 1.1s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: 0.3s;
    opacity: 0;
  }

  .confetti {
    position: fixed;
    top: -20px;
    z-index: 6;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); opacity: 0.2; }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="stage">
    <button id="clickBtn" onclick="celebrate()">Click Here 🎉</button>
    <div id="greeting">🎂 Happy Birthday<br>Malik Sahab. 🎂</div>
    <div class="deco" id="deco">🎈💖✨💖🎈</div>
  </div>

  <script>
    function celebrate() {
      document.getElementById('clickBtn').style.display = 'none';
      document.getElementById('greeting').style.display = 'block';
      document.getElementById('deco').style.display = 'block';

      const colors = ['#ff5da2', '#ffd76b', '#7b2ff7', '#5bd6ff', '#ff8c42', '#8cff6b'];

      for (let i = 0; i < 16; i++) {
        const h = document.createElement('div');
        h.className = 'heart';
        h.style.left = Math.random() * 90 + 'vw';
        h.style.transform = 'scale(' + (0.8 + Math.random() * 0.9) + ')';
        h.style.animationDuration = (5 + Math.random() * 4) + 's';
        h.style.animationDelay = (Math.random() * 3) + 's';
        document.body.appendChild(h);
      }

      for (let i = 0; i < 22; i++) {
        const b = document.createElement('div');
        b.className = 'balloon';
        b.style.left = Math.random() * 90 + 'vw';
        b.style.background = colors[Math.floor(Math.random() * colors.length)];
        b.style.animationDuration = (5 + Math.random() * 4) + 's';
        b.style.animationDelay = (Math.random() * 2.5) + 's';
        b.style.width = (48 + Math.random() * 24) + 'px';
        b.style.height = b.style.width;
        document.body.appendChild(b);
      }

      for (let i = 0; i < 60; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.width = (6 + Math.random() * 6) + 'px';
        c.style.height = c.style.width;
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.animationDuration = (3 + Math.random() * 3) + 's';
        c.style.animationDelay = (Math.random() * 1.5) + 's';
        document.body.appendChild(c);
      }
    }
  </script>

</body>
</html>
