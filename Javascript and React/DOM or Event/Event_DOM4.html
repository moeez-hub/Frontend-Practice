<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="password" id="input" placeholder="enter password">
    <button id="btn">clck</button>
    <h1 id="output"></h1>
    <script>

        let btn = document.getElementById("btn");
        btn.addEventListener("click", function(){
            let pass = document.getElementById("input");
            if(pass.value === "1234"){
            document.getElementById("output").textContent = "Password correct";
            document.getElementById("output").style.color = "green";
        }
            else{
                document.getElementById("output").textContent= "Not correct";
                document.getElementById("output").style.color = "red";
            };
        });

    </script>
</body>
</html>
