<!DOCTYPE html>
<html lang="en">

<head>
    <link href="./output.css" rel="stylesheet">
    <title>Document</title>

</head>

<body>

    <div class="absolute top-[45px] left-[40px] size-[65px]">
        <img src="Screenshot_select-area_20260815001613.png" alt="">
    </div>

    <div class="size-[485px] absolute bottom-[220px] left-[290px]">
        <img src="Computer.png" alt="">
    </div>

    <div class="font-semibold font-[Arial,Helvetica,sans-serif]">
        <h1 class="text-black text-[60px] absolute bottom-[280px] left-[40px]"> Explore</h1>
        <h1 class="text-black text-[60px] absolute bottom-[210px] left-[40px]"> the</h1>
        <h1 class="text-black text-[60px] absolute bottom-[140px] left-[40px]"> things</h1>
        <h1 class="text-blue-600 text-[60px] absolute bottom-[70px] left-[40px]"> you love</h1>
        <h1 class="text-black text-[50px] absolute bottom-[72px] left-[283px]">.</h1>
    </div>

    <form action="">
        <div class="absolute bottom-[220px] right-[60px]">
            <label for="">Log in to Facebook</label><br><br>
        
               <input id="input1" type="text" placeholder="Email address or mobile number"
                class="border border-gray-300 rounded-[16px] w-[530px] p-4 text-gray-600">

            <br><br>

                <input id="input2" type="password" placeholder="Password"
                class="border border-gray-300 rounded-[16px] w-[530px] p-4 text-gray-600"><br><br>
              

                <p id="message"></p><br>
            <button type="button" id="login_btn" class="bg-blue-600 border-b-gray-500 w-[530px] py-2.5 rounded-4xl text-amber-100 ">Log
                in</button><br><br>
            <button type="button" class="border-0 rounded-4xl w-[530px] py-2.5 bg-white hover:bg-gray-400"> Forgetten
                password?</button>
            <br><br>
            <button
               type="button" class="border-[1px] border-b-blue-700 rounded-4xl py-2.5 w-[530px] text-shadow-cyan-500 hover:bg-gray-400">Create
                new account</button>
        </div>
     </form>

    <script>
            let btn = document.getElementById("login_btn");
            let input1 = document.getElementById("input1");
           let input2 = document.getElementById("input2");
            let output = document.getElementById("message");

            btn.addEventListener("click", function(){
                if(input1.value === "" || input2.value === ""){
                output.textContent = "fill the blank";
                }
            else{
                   output.textContent = "Login done";
                    
                }
            })
    </script>
</body>

</html>
