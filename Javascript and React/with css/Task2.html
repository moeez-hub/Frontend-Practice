<!DOCTYPE html>
<html lang="en">
<head>
 <link href="./output.css" rel="stylesheet">
    <title>Document</title>
</head>
<body class="bg-gray-200">
    <h1 class="text-blue-500 text-[50px] absolute top-4 left-[280px] ">Pure CSS Custom Checkboxes</h1>

    <div class="absolute top-28 left-[350px]">
<ul>
  <li>
    <input type="checkbox" value="value1" class="my-[15px]">
    <label>Checkbox</label>
  </li>
  <li>
    <input class="my-[15px]" type="checkbox" value="value2" checked>
    <label>CSS Only</label>
  </li>
  <li>
    <input class="my-[15px]" type="checkbox" value="value3" disabled>
    <label>A disabled checkbox</label>
  </li>
  <li>
    <input class="my-[15px]" type="checkbox" value="value4">
    <label>Fourth option</label>
  </li>
</ul>
</div>
</body>
</html>
