<!DOCTYPE html>
<html lang="en">

<head>
    <link href="./output.css" rel="stylesheet">
    <title>Document</title>
</head>

<body class="bg-black">

    <div class="bg-emerald-200 py-[10px] px-4">
        <h2>Hey! Read Me...</h2><br>
        <p>This is an example of what you can do with pure css to style radio buttons or checkboxes. If you are looking
            a more flexible & mordern way to style radio buttons on forms, take a look at this <a target="_blank"
                href="https://codepen.io/AngelaVelasquez/details/BWXbxP" title="SVG radio buttons">version with SVG
                icons</a>. I also wrote a <a target="_blank"
                href="https://codepen.io/AngelaVelasquez/post/css-styling-radio-button">post</a> about it.</p>
    </div>

    <div class="static md:absolute md:top-[200px] md:left-[450px] text-gray-400 text-[20px] p-4">
        <h2>Your favorite thing in the world:</h2>

        <ul>
            <div class="my-8 hover:text-amber-50">
                <li>
                    <input type="radio" id="f-option" name="selector"
                        class="w-5 h-5 appearance-none rounded-full bg-black border-2 checked:bg-amber-400">
                    <label for="f-option">Pizza</label>
                </li>
            </div>

            <div class="my-8 hover:text-amber-50">
                <li>
                    <input type="radio" id="s-option" name="selector"
                        class="w-5 h-5 appearance-none rounded-full bg-black border-2 checked:bg-amber-400">
                    <label for="s-option">Bacon</label>
                </li>
            </div>

            <div class="my-8 hover:text-amber-50">
                <li>
                    <input type="radio" id="t-option" name="selector"
                        class="w-5 h-5 appearance-none rounded-full bg-black border-2 checked:bg-amber-400">
                    <label for="t-option">Cats</label>
                </li>
            </div>
        </ul>
    </div>

</body>

</html>
