<!DOCTYPE html>
<html lang="en">
<head>
    <link href="./output.css" rel="stylesheet">
    <title>Currency Converter</title>
</head>
<body class="bg-olive-600 flex justify-center items-center min-h-screen">
    <div class="border-4 w-[500px] mx-auto bg-white p-6 rounded-lg text-center">
        <h1>Currency Converter</h1><br><br>
        <p>Enter Amount</p>
        <input type="number" class="border-2 rounded p-1">
        <br><br>

        <div class="flex justify-center items-center gap-17
        ">
            <div class="flex flex-col items-center">
                <img src="https://flagsapi.com/PK/flat/64.png">
                <label>From</label>
                <select class="border-2 rounded p-1 mt-1">
                    <option value="Pkr">PKR</option>
                    <option value="Usd">>USD</option>
                </select>
            </div>

            <div class="flex flex-col items-center">
                <img src="https://flagsapi.com/US/flat/64.png" alt="">
                <label>To</label>
                <select class="border-2 rounded p-1 mt-1">
                    <option value="Pkr">PKR</option>
                    <option value="Usd">USD</option>
                </select>
            </div>
        </div>

        <br><br>
        <p>1 usd is equal to 280 pkr</p>
        <br>
        <input class="border-2 py-1.5 w-[200px] rounded-[10px] bg-orange-500 text-white hover:bg-amber-700 cursor-pointer" type="button" value="Click for exchange">
    </div>
</body>
</html>
